<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anthony Round - Projects</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Game Controls Styling */
    #game-container {
      margin-top: 15px;
      display: none; /* hide iframe until Play clicked */
    }

    iframe {
      border: none;
      width: 100%;
      max-width: 800px;
      height: 600px;
    }

    .game-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .game-controls button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    #playBtn { background: #4caf50; color: white; }
    #stopBtn { background: #f44336; color: white; }

    .source-link {
      background: #2196f3;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 1rem;
    }

    .source-link:hover {
      background-color: #1976d2;
    }
  </style>
</head>
